# Zae Project - Cross-Project API Contracts
# Version: 1.1.0
# Last Updated: May 23, 2026
# Classification: Internal
#
# 1.1.0 changes (May 2026):
#   - Added four interface blocks to cover all six cross-pillar pairs:
#       mindtransfer_consciousness, thermodynamic_consciousness,
#       thermodynamic_arkspace, thermodynamic_brain_emulation.
#   - Original 1.0.0 only covered arkspace_mindtransfer and arkspace_consciousness.
#   - Substrate pillar (thermodynamic-core) was added to the platform in April 2026
#     and was not represented in 1.0.0.

apiVersion: zae-project.org/v1
kind: APIContract
metadata:
  name: unified-api-contracts
  description: Machine-readable interface contracts across all four pillars (ArkSpace, MindTransfer, Consciousness, Substrate)
  version: "1.1.0"
  classification: Internal

---
# ARKSPACE ↔ MINDTRANSFER INTERFACE
---

arkspace_mindtransfer:
  interface_name: "Neural Data Transmission"
  version: "1.0.0"
  status: "Draft"
  
  # ===========================================================================
  # MESSAGE SCHEMAS (Protobuf)
  # ===========================================================================
  
  protobuf_schemas:
    
    # UPLINK: Brain → Satellite
    spike_stream_uplink:
      message_name: "SpikeStreamUplink"
      direction: "UPLINK"
      priority: "REALTIME"
      
      fields:
        - name: "session_id"
          type: "uint64"
          required: true
          description: "Unique session identifier"
          
        - name: "timestamp_ns"
          type: "uint64"
          required: true
          description: "GPS-synchronized nanosecond timestamp"
          
        - name: "sequence_number"
          type: "uint32"
          required: true
          description: "Packet sequence for ordering and replay detection"
          
        - name: "spike_events"
          type: "repeated SpikeEvent"
          required: true
          description: "Array of spike events"
          
        - name: "compression"
          type: "CompressionType enum"
          required: false
          default: "LZ4"
          
        - name: "checksum"
          type: "uint32"
          required: true
          description: "CRC32 for integrity verification"
      
      nested_types:
        spike_event:
          fields:
            - name: "neuron_id"
              type: "uint32"
              description: "Global neuron identifier (0 to 4.3B)"
              
            - name: "timestamp_offset_us"
              type: "uint32"
              description: "Microsecond offset from message timestamp"
              
            - name: "amplitude"
              type: "float32"
              required: false
              description: "Optional spike amplitude"
        
        compression_type:
          enum_values: ["NONE", "LZ4", "ZSTD"]
      
      performance_requirements:
        max_latency_ms: 17
        bandwidth_mbps: [100, 1000]
        packet_rate_per_second: [10000, 100000]
        typical_packet_size_kb: [1, 10]
    
    # DOWNLINK: Satellite → Brain
    stimulation_command_downlink:
      message_name: "StimulationCommandDownlink"
      direction: "DOWNLINK"
      priority: "REALTIME"
      
      fields:
        - name: "session_id"
          type: "uint64"
          required: true
          
        - name: "timestamp_ns"
          type: "uint64"
          required: true
          
        - name: "sequence_number"
          type: "uint32"
          required: true
          
        - name: "stim_events"
          type: "repeated StimulationEvent"
          required: true
          
        - name: "safety_signature"
          type: "SafetyChecksum"
          required: true
          description: "Cryptographic signature from Neural Firewall"
          
        - name: "checksum"
          type: "uint32"
          required: true
      
      nested_types:
        stimulation_event:
          fields:
            - name: "electrode_id"
              type: "uint32"
              
            - name: "amplitude_uA"
              type: "int16"
              description: "Current amplitude in microamps"
              constraints:
                min: -100
                max: 100
              
            - name: "duration_us"
              type: "uint16"
              description: "Pulse duration in microseconds"
              
            - name: "waveform"
              type: "WaveformType enum"
              
            - name: "timestamp_offset_us"
              type: "uint32"
        
        waveform_type:
          enum_values: ["MONOPHASIC", "BIPHASIC", "CHARGE_BALANCED"]
        
        safety_checksum:
          fields:
            - name: "signature"
              type: "bytes"
              description: "HMAC-SHA256 from firewall"
              
            - name: "firewall_timestamp"
              type: "uint64"
      
      safety_limits:
        max_amplitude_uA: 100
        max_frequency_hz: 200
        max_charge_per_phase_nC: 50
        max_duty_cycle_percent: 50
      
      performance_requirements:
        max_latency_ms: 23
        bandwidth_mbps: [100, 1000]
  
  # ===========================================================================
  # REST API CONTRACTS
  # ===========================================================================
  
  rest_api:
    base_url: "https://edge.arkspace.me/api/v1"
    authentication: "Bearer token (OAuth 2.0)"
    
    endpoints:
      
      create_session:
        path: "/sessions"
        method: "POST"
        description: "Create new neural streaming session"
        
        request_body:
          content_type: "application/json"
          schema:
            type: "object"
            required: ["user_id", "interface_id"]
            properties:
              user_id:
                type: "string"
                format: "uuid"
              interface_id:
                type: "string"
                description: "MindTransfer device ID"
              target_satellite:
                type: "string"
                required: false
              encryption_key_id:
                type: "string"
        
        response:
          status_code: 201
          schema:
            type: "object"
            properties:
              session_id:
                type: "string"
                format: "uuid"
              encryption_key:
                type: "string"
                format: "base64"
              satellite_endpoint:
                type: "string"
                format: "uri"
              edge_node_endpoint:
                type: "string"
                format: "uri"
              qos_tier:
                type: "string"
                enum: ["REALTIME", "BULK", "BEST_EFFORT"]
              max_latency_ms:
                type: "integer"
              expires_at:
                type: "string"
                format: "date-time"
      
      get_session_status:
        path: "/sessions/{session_id}"
        method: "GET"
        
        parameters:
          - name: "session_id"
            in: "path"
            type: "string"
            format: "uuid"
        
        response:
          status_code: 200
          schema:
            type: "object"
            properties:
              session_id: {type: "string"}
              status: {type: "string", enum: ["ACTIVE", "PAUSED", "DISCONNECTED"]}
              satellite_connection: {type: "boolean"}
              uplink_latency_ms: {type: "number"}
              downlink_latency_ms: {type: "number"}
              rtt_ms: {type: "number"}
              packet_loss_uplink_percent: {type: "number"}
              packet_loss_downlink_percent: {type: "number"}
              bandwidth_uplink_mbps: {type: "number"}
              bandwidth_downlink_mbps: {type: "number"}
      
      emergency_stop:
        path: "/sessions/{session_id}/emergency-stop"
        method: "POST"
        description: "Emergency halt of all stimulation"
        
        response_time_requirement_ms: 100
        
        response:
          status_code: 200
          schema:
            type: "object"
            properties:
              session_id: {type: "string"}
              status: {type: "string", enum: ["EMERGENCY_STOPPED"]}
              stopped_at: {type: "string", format: "date-time"}
              actions_taken: {type: "array", items: {type: "string"}}
  
  # ===========================================================================
  # WEBSOCKET API
  # ===========================================================================
  
  websocket_api:
    endpoint: "wss://edge.arkspace.me/stream/{session_id}"
    protocol: "Binary (Protobuf) + JSON control messages"
    
    client_to_server:
      - message_type: "spike_stream"
        format: "binary"
        schema: "SpikeStreamUplink protobuf"
        
      - message_type: "control"
        format: "json"
        schema:
          type: "object"
          properties:
            type: {type: "string", const: "CONTROL"}
            command: {type: "string", enum: ["PAUSE", "RESUME", "SET_PARAMETERS"]}
            parameters: {type: "object"}
      
      - message_type: "heartbeat"
        format: "json"
        frequency_seconds: 1
        schema:
          type: "object"
          properties:
            type: {type: "string", const: "HEARTBEAT"}
            timestamp: {type: "string", format: "date-time"}
            device_status: {type: "string", enum: ["OK", "WARNING", "ERROR"]}
    
    server_to_client:
      - message_type: "stim_command"
        format: "binary"
        schema: "StimulationCommandDownlink protobuf"
        
      - message_type: "status"
        format: "json"
        frequency_seconds: 5
        
      - message_type: "alert"
        format: "json"
        schema:
          type: "object"
          properties:
            type: {type: "string", const: "ALERT"}
            severity: {type: "string", enum: ["INFO", "WARNING", "CRITICAL"]}
            message: {type: "string"}
            timestamp: {type: "string", format: "date-time"}

---
# ARKSPACE ↔ CONSCIOUSNESS INTERFACE
---

arkspace_consciousness:
  interface_name: "SNN Deployment & State Management"
  version: "1.0.0"
  status: "Draft"
  
  # ===========================================================================
  # SNN STATE TRANSFER SCHEMA
  # ===========================================================================
  
  protobuf_schemas:
    
    snn_state:
      message_name: "SNNState"
      description: "Complete SNN state for migration between satellites"
      
      fields:
        - name: "header"
          type: "StateHeader"
          required: true
          
        - name: "neurons"
          type: "repeated NeuronState"
          required: true
          
        - name: "synapses"
          type: "repeated SynapseState"
          required: true
          
        - name: "compression"
          type: "CompressionMetadata"
          required: true
      
      nested_types:
        state_header:
          fields:
            - {name: "source_node_id", type: "string"}
            - {name: "destination_node_id", type: "string"}
            - {name: "timestamp_ns", type: "uint64"}
            - {name: "state_version", type: "uint32"}
            - {name: "neuron_count", type: "uint64"}
            - {name: "synapse_count", type: "uint64"}
            - {name: "checksum_sha256", type: "bytes"}
        
        neuron_state:
          fields:
            - {name: "neuron_id", type: "uint32"}
            - {name: "membrane_potential_mV", type: "float32"}
            - {name: "refractory_remaining_us", type: "uint16"}
            - {name: "last_spike_time_ns", type: "uint64"}
            - {name: "adaptation_current", type: "float32"}
        
        synapse_state:
          fields:
            - {name: "synapse_id", type: "uint64"}
            - {name: "pre_neuron_id", type: "uint32"}
            - {name: "post_neuron_id", type: "uint32"}
            - {name: "weight", type: "float32"}
            - {name: "eligibility_trace", type: "float32"}
        
        compression_metadata:
          fields:
            - {name: "type", type: "CompressionType enum"}
            - {name: "original_size_bytes", type: "uint32"}
            - {name: "compressed_size_bytes", type: "uint32"}
            - {name: "compression_ratio", type: "float32"}
      
      performance_requirements:
        transfer_bandwidth_gbps: [10, 60]
        max_transfer_latency_ms: 50
        max_migration_duration_ms: 200
    
    spike_stream_inter_satellite:
      message_name: "SpikeStreamInterSatellite"
      description: "Real-time spike routing between satellites"
      
      fields:
        - {name: "session_id", type: "uint64"}
        - {name: "source_node_id", type: "uint8"}
        - {name: "destination_node_id", type: "uint8"}
        - {name: "timestamp_ns", type: "uint64"}
        - {name: "sequence_number", type: "uint32"}
        - {name: "spike_events", type: "repeated SpikeEvent"}
        - {name: "priority", type: "PriorityLevel enum"}
        - {name: "checksum", type: "uint32"}
      
      nested_types:
        priority_level:
          enum_values: ["CRITICAL", "HIGH", "NORMAL"]
          latency_targets_ms: [5, 10, 20]
  
  # ===========================================================================
  # SNN DEPLOYMENT API
  # ===========================================================================
  
  rest_api:
    base_url: "https://ground.arkspace.me/api/v1"
    authentication: "Bearer token + X.509 client certificate"
    
    endpoints:
      
      deploy_snn_model:
        path: "/nodes/{node_id}/snn"
        method: "POST"
        description: "Deploy compiled SNN model to satellite"
        
        request:
          content_type: "application/octet-stream"
          body: "Binary SNN model package (Nengo-compiled)"
          
          query_parameters:
            - {name: "model_version", type: "string", required: true}
            - {name: "checksum", type: "string", format: "sha256", required: true}
            - {name: "replace_existing", type: "boolean", default: true}
        
        response:
          status_code: 202
          schema:
            type: "object"
            properties:
              deployment_id: {type: "string", format: "uuid"}
              node_id: {type: "string"}
              status: {type: "string", enum: ["UPLOADING", "VERIFYING", "ACTIVATING"]}
              estimated_completion_seconds: {type: "integer"}
      
      get_snn_status:
        path: "/nodes/{node_id}/snn"
        method: "GET"
        
        response:
          status_code: 200
          schema:
            type: "object"
            properties:
              node_id: {type: "string"}
              model_version: {type: "string"}
              deployed_at: {type: "string", format: "date-time"}
              status: {type: "string", enum: ["RUNNING", "PAUSED", "UPDATING", "ERROR"]}
              neuron_count: {type: "integer"}
              synapse_count: {type: "integer"}
              utilization_percent: {type: "number"}
              power_consumption_watts: {type: "number"}
              temperature_celsius: {type: "number"}
      
      get_snn_state_snapshot:
        path: "/nodes/{node_id}/snn/state"
        method: "GET"
        
        query_parameters:
          - {name: "format", type: "string", enum: ["summary", "full", "sparse"]}
        
        response:
          content_type: "application/octet-stream"
          headers:
            - {name: "X-State-Version", type: "string"}
            - {name: "X-Neuron-Count", type: "integer"}
            - {name: "X-Checksum", type: "string", format: "sha256"}
          body: "SNNState protobuf"
      
      load_snn_state:
        path: "/nodes/{node_id}/snn/state"
        method: "PUT"
        description: "Load SNN state for migration or restore"
        
        request:
          content_type: "application/octet-stream"
          headers:
            - {name: "X-Source-Node", type: "string"}
            - {name: "X-State-Version", type: "string"}
          body: "SNNState protobuf"
        
        response:
          status_code: 200
          schema:
            type: "object"
            properties:
              node_id: {type: "string"}
              state_loaded: {type: "boolean"}
              state_version: {type: "string"}
              load_duration_ms: {type: "integer"}
              verification: {type: "string", enum: ["PASSED", "FAILED"]}
  
  # ===========================================================================
  # NEURAL FIREWALL API
  # ===========================================================================
  
  firewall_api:
    base_url: "https://ground.arkspace.me/api/v1/firewall"
    
    endpoints:
      
      get_security_events:
        path: "/events"
        method: "GET"
        
        query_parameters:
          - {name: "since", type: "string", format: "date-time"}
          - {name: "severity", type: "string", enum: ["INFO", "WARNING", "CRITICAL", "EMERGENCY"]}
          - {name: "limit", type: "integer", default: 100}
        
        response:
          schema:
            type: "object"
            properties:
              events:
                type: "array"
                items:
                  type: "object"
                  properties:
                    event_id: {type: "string", format: "uuid"}
                    timestamp: {type: "string", format: "date-time"}
                    severity: {type: "string"}
                    source: {type: "string", enum: ["EDGE_NODE", "SATELLITE", "GROUND_STATION"]}
                    event_type: {type: "string"}
                    description: {type: "string"}
                    affected_session_id: {type: "string"}
                    action_taken: {type: "string"}
      
      activate_kill_switch:
        path: "/kill-switch"
        method: "POST"
        description: "Emergency shutdown of neural stimulation"
        
        request_body:
          schema:
            type: "object"
            required: ["session_id", "reason"]
            properties:
              session_id: {type: "string"}
              reason: {type: "string"}
              scope: {type: "string", enum: ["SESSION", "NODE", "CONSTELLATION"]}
        
        response:
          status_code: 200
          response_time_requirement_ms: 100
          schema:
            type: "object"
            properties:
              kill_switch_activated: {type: "boolean"}
              scope: {type: "string"}
              affected_sessions: {type: "array", items: {type: "string"}}
              timestamp: {type: "string", format: "date-time"}
              actions_taken: {type: "array", items: {type: "string"}}

---
# MINDTRANSFER ↔ CONSCIOUSNESS INTERFACE
# Source spec: zae-docs/integration/mindtransfer-consciousness-interface.md (695 lines)
---

mindtransfer_consciousness:
  interface_name: "Brain ↔ SNN Engine Stream"
  version: "1.0.0"
  status: "Draft"

  protobuf_schemas:

    # UPLINK: BCI → SNN Engine
    biological_spike_stream:
      message_name: "BiologicalSpikeStream"
      direction: "BRAIN_TO_SNN"
      priority: "REALTIME"

      fields:
        - {name: "session_id", type: "uint64", required: true}
        - {name: "timestamp_ns", type: "uint64", required: true}
        - {name: "sequence", type: "uint32", required: true}
        - {name: "spike_events", type: "repeated SpikeEvent", required: true}
        - {name: "lfp_summary", type: "repeated LFPSummary", required: false}

      nested_types:
        spike_event:
          fields:
            - {name: "electrode_id", type: "uint16"}
            - {name: "channel_id", type: "uint8"}
            - {name: "neuron_id", type: "uint32", description: "Sorted neuron identity"}
            - {name: "timestamp_offset_us", type: "uint16"}
            - {name: "amplitude_uV", type: "int16"}
            - {name: "waveform_features", type: "float16[8]", description: "Extracted spike shape"}
            - {name: "confidence", type: "float16", description: "Spike sorting confidence"}

        lfp_summary:
          fields:
            - {name: "region_id", type: "uint8"}
            - {name: "power_spectrum", type: "float16[8]", description: "Frequency band powers"}
            - {name: "phase", type: "float16"}

      performance_requirements:
        max_latency_ms: 5
        encryption: "AES-256-GCM"
        compression: "none"
        packet_rate_per_second: [10000, 50000]

    # DOWNLINK: SNN Engine → BCI
    snn_stim_command:
      message_name: "SNNStimCommand"
      direction: "SNN_TO_BRAIN"
      priority: "REALTIME"

      fields:
        - {name: "session_id", type: "uint64", required: true}
        - {name: "timestamp_ns", type: "uint64", required: true}
        - {name: "sequence", type: "uint32", required: true}
        - {name: "safety_signature", type: "bytes", description: "32 bytes, signed by Neural Firewall"}
        - {name: "stimulation_events", type: "repeated StimulationEvent", required: true}

      nested_types:
        stimulation_event:
          fields:
            - {name: "electrode_id", type: "uint16"}
            - {name: "target_neuron_type", type: "TargetNeuronType enum"}
            - {name: "amplitude_uA", type: "int16"}
            - {name: "pulse_width_us", type: "uint16"}
            - {name: "waveform", type: "WaveformType enum"}
            - {name: "inter_pulse_interval_us", type: "uint16"}
            - {name: "train_duration_ms", type: "uint8"}
            - {name: "execution_time_ns", type: "uint64", description: "When to execute"}
            - {name: "max_delay_tolerance_ms", type: "uint8"}

        target_neuron_type:
          enum_values: ["EXCITATORY", "INHIBITORY"]

        waveform_type:
          enum_values: ["MONOPHASIC_CATHODIC", "MONOPHASIC_ANODIC", "BIPHASIC_CATHODIC_FIRST", "BIPHASIC_ANODIC_FIRST", "CHARGE_BALANCED_SYMMETRIC"]

      safety_limits:
        max_amplitude_uA: 100
        max_charge_per_phase_nC: 50
        max_frequency_hz: 200
        max_duty_cycle_percent: 50
        min_inter_train_interval_ms: 10

      performance_requirements:
        max_latency_ms: 5
        encryption: "AES-256-GCM"

    # SNN → MindTransfer encoding feedback
    prediction_feedback:
      message_name: "PredictionFeedback"
      direction: "SNN_TO_BRAIN"
      priority: "HIGH"
      description: "Generative model predictions used by MindTransfer to compress redundant uplink data"

      fields:
        - {name: "session_id", type: "uint64"}
        - {name: "timestamp_ns", type: "uint64"}
        - {name: "prediction_frame_id", type: "uint32"}
        - {name: "predicted_spikes", type: "repeated PredictedSpike"}
        - {name: "error_corrections", type: "repeated ErrorCorrection"}
        - {name: "encoding_parameters", type: "EncodingHints"}

---
# THERMODYNAMIC ↔ CONSCIOUSNESS INTERFACE
# Source spec: zae-docs/integration/thermodynamic-consciousness-interface.md (128 lines)
---

thermodynamic_consciousness:
  interface_name: "Substrate ↔ SNN Engine"
  version: "0.1.0"
  status: "Draft (TRL 2)"
  description: "Offline training and runtime inference contract between TC substrate and the SNN engine"

  protobuf_schemas:

    # SNN Engine → TC Substrate (offline parameter transfer)
    tc_parameter_set:
      message_name: "TCParameterSet"
      direction: "SNN_TO_TC"
      priority: "OFFLINE"
      description: "Trained (J,b) parameters from SNN engine, ready for programming into TSU non-volatile memory"

      fields:
        - {name: "model_id", type: "string", format: "uuid"}
        - {name: "model_version", type: "string"}
        - {name: "neuron_count", type: "uint32"}
        - {name: "coupling_matrix_J", type: "SparseMatrix", description: "J[i,j] excitatory→negative, inhibitory→positive"}
        - {name: "bias_vector_b", type: "float32[]"}
        - {name: "temperature_kT", type: "float32", description: "Operating temperature for TC substrate"}
        - {name: "signature", type: "bytes", description: "Cryptographic signature for parameter integrity"}
        - {name: "trained_at", type: "string", format: "date-time"}

      fidelity_requirements:
        activation_cosine_similarity_min: 0.99
        spike_timing_correlation_min: 0.90
        generative_quality_within_baseline_percent: 5

    # TC Substrate → SNN Engine (runtime inference)
    tc_inference_output:
      message_name: "TCInferenceOutput"
      direction: "TC_TO_SNN"
      priority: "REALTIME"
      description: "Equilibrium sample from TC Langevin relaxation, consumed by SNN runtime"

      fields:
        - {name: "session_id", type: "uint64"}
        - {name: "timestamp_ns", type: "uint64"}
        - {name: "model_id", type: "string", format: "uuid"}
        - {name: "sample_format", type: "SampleFormat enum"}
        - {name: "sample_data", type: "bytes", description: "Format depends on sample_format"}
        - {name: "dtm_step_index", type: "uint32", description: "Which step in the DTM chain"}
        - {name: "anomaly_score", type: "float32", description: "Output distribution shift indicator for firewall"}

      nested_types:
        sample_format:
          enum_values: ["BOLTZMANN_BINARY", "ISING_CONTINUOUS", "LANGEVIN_TRAJECTORY"]

    # Digital conditioning (bias vector injection)
    digital_conditioning_input:
      message_name: "DigitalConditioningInput"
      direction: "SNN_TO_TC"
      priority: "REALTIME"
      description: "Per-step bias vectors computed by SNN host, anchoring TC substrate to input"

      fields:
        - {name: "session_id", type: "uint64"}
        - {name: "timestamp_ns", type: "uint64"}
        - {name: "bias_enc", type: "float32[]", description: "Encoder bias vector"}
        - {name: "bias_dec", type: "float32[]", description: "Decoder bias vector"}
        - {name: "step_index", type: "uint32"}

  performance_requirements:
    digital_conditioning_compute_ms: {target: 2, maximum: 5}
    tc_langevin_relaxation_per_dtm_step_ms: {target: 10, maximum: 20}
    full_dtm_inference_chain_ms: {target: 30, maximum: 50}
    libet_buffer_remaining_ms: {minimum: 200}

  security:
    parameter_integrity: "Cryptographic signing of {J,b} at programming time, verified before NVM write"
    inference_channel: "AES-256 on digital conditioning bus"
    output_anomaly_detection: "Distribution-shift monitoring on TC equilibrium samples"

---
# THERMODYNAMIC ↔ ARKSPACE INTERFACE
# Source spec: zae-docs/integration/thermodynamic-arkspace-interface.md (139 lines)
---

thermodynamic_arkspace:
  interface_name: "Substrate ↔ Orbital Payload"
  version: "0.1.0"
  status: "Draft (TRL 1-2)"
  description: "TC hardware as the proposed physical computing paradigm for arkspace-core neural payloads"

  hardware_contracts:

    power_budget:
      tsu_array_watts: {maximum: 100, description: "p-bit sampling cells"}
      digital_conditioning_processor_watts: {maximum: 20, description: "ARM/RISC-V running bias-vector computation"}
      nvm_parameter_memory_watts: {maximum: 5, description: "Stores {J,b}; embedded MRAM preferred"}
      thermal_control_subsystem_watts: {maximum: 30, description: "Active control to stabilize kT"}
      total_payload_watts: {maximum: 200, description: "Per arkspace-core specification"}

    thermal_interface:
      operating_temperature_K: {min: 280, max: 320, description: "Stable kT range; avoids LEO -40 to +80C extremes"}
      temperature_variation_tolerance_K: 5
      active_thermal_control_required: true

    radiation_environment:
      target_tid_tolerance_krad_si: 30
      mission_duration_years: 2
      seu_response: "Random p-bit state flip; tolerable in stochastic architecture; characterization pending"
      tid_response: "Subthreshold transistor threshold shift; mitigated by periodic theta recalibration via uplink"
      thermal_cycling_mitigation: "Active thermal control (see thermal_interface)"

  protobuf_schemas:

    # Ground → TSU (parameter delta uplink)
    tc_parameter_uplink:
      message_name: "TCParameterUplink"
      direction: "GROUND_TO_SAT"
      priority: "BULK"
      description: "Theta-update payload; delta-encoded against current TSU parameter state"

      fields:
        - {name: "payload_id", type: "string", format: "uuid"}
        - {name: "target_node_id", type: "string"}
        - {name: "model_id", type: "string", format: "uuid"}
        - {name: "parameter_delta", type: "bytes", description: "Compressed delta of {J,b}; vendor-specific format"}
        - {name: "delta_baseline_version", type: "string"}
        - {name: "new_version", type: "string"}
        - {name: "signature", type: "bytes", description: "Cryptographic signature verified before NVM programming"}
        - {name: "encryption", type: "string", const: "AES-256-GCM"}

      performance_requirements:
        uplink_bandwidth_class: "BULK (not on motor loop)"
        signature_verification_required: true

    # OISL packetization of TC output
    tc_oisl_egress:
      message_name: "TCOISLEgress"
      direction: "PAYLOAD_INTERNAL"
      priority: "REALTIME"
      description: "Conversion from TC equilibrium sample to OISL spike-event packet"

      conversion_table:
        - {tc_format: "Boltzmann sample (binary)", oisl_format: "Spike event list", rule: "Each x_i=+1 → spike event at node i"}
        - {tc_format: "Langevin trajectory (continuous)", oisl_format: "Rate-coded packets", rule: "r_i = (x_i + 1)/2 * r_max"}
        - {tc_format: "DTM step output", oisl_format: "Streaming sample", rule: "One DTM step → one OISL frame"}

---
# THERMODYNAMIC ↔ BRAIN-EMULATION INTERFACE
# Source spec: zae-docs/integration/thermodynamic-brain-emulation-interface.md
---

thermodynamic_brain_emulation:
  interface_name: "Substrate ↔ Atlas Translator"
  version: "0.1.0"
  status: "Draft (Phase 2 target)"
  description: "Offline translator from Brian2 atlas templates to TC coupling matrices; canonical implementation lives in brain-emulation/"

  translator_contract:

    input:
      format_options:
        - "Brian2 Network object (Python in-memory)"
        - "Atlas template JSON path (per brain-emulation/data/brain_region_maps/manifest.json schema)"

    output:
      structure:
        J:
          type: "sparse_matrix_float32"
          description: "Coupling matrix; J[i,j] = -w[i,j] if excitatory else +|w[i,j]|"
        b:
          type: "float32[]"
          description: "Bias vector; b[i] = I_bias[i]"
        kT:
          type: "float32"
          description: "Temperature consistent with template noise envelope"
        metadata:
          neuron_count: "uint32"
          source_template_id: "string"
          step_count: "uint32"
          temporal_resolution_ms: "float32"

    api:
      python_signature: "CouplingMatrix.from_brian2_network(network) -> (J, b, kT)"
      backend_reference: "NumPy required; JAX optional"
      implementation_home: "brain-emulation/"

    validation_criterion:
      metric: "Activation cosine similarity"
      threshold: 0.99
      reference: "Brian2 realistic-mode run on the same template (Whitelam and Casert 2026 benchmark)"

    failure_mode: "Typed error on unmappable Brian2 features (multi-compartment, gap junctions, custom equations); never silent degrade"

  shared_benchmarks:
    mnist:
      brain_emulation_side: "Brian2 LIF classifier"
      tc_side: "RBM / DTCA classifier (thermodynamic-core/sims/boltzmann/)"
      metric: "Top-1 accuracy"
      target: "Within 5 percent parity"

    allen_motor_cortex:
      brain_emulation_side: "Realistic-mode Brian2 simulation of Allen_Motor_Cortex template"
      tc_side: "TC Langevin sampling on translated (J,b,kT)"
      metrics:
        - "Firing-rate distribution KL divergence"
        - "Pairwise correlation matrix Frobenius distance"

    split_brain:
      brain_emulation_side: "Two coupled Brian2 hemispheres with corpus-callosum severance"
      tc_side: "Two coupled TC substrates with the same severance"
      metric: "Hemispheric independence statistic"
      cross_reference: "neutral-consciousness-engine/ros2_ws/.../tests/split_brain_test.py"

  performance_requirements:
    translation_runtime_s_per_template: {target: 5, maximum: 10, hardware: "CPU"}
    translator_peak_memory_gb: {maximum: 4}
    brian2_validation_run_minutes: {maximum: 5}
    realtime_constraint: "none (not on motor loop)"

  security:
    template_sensitivity: "Open scientific data; not sensitive"
    derived_parameter_handling: "If (J,b) loaded into production payload, falls under security-architecture.md §10.1 (parameter memory as high-value target); signing happens downstream in the orbital-uplink path, not in the translator"

---
# SECURITY CONTRACTS (ALL INTERFACES)
---

security:
  
  authentication:
    user_level:
      method: "OAuth 2.0"
      mfa_required: true
      providers: ["Google", "Microsoft", "Custom IdP"]
      session_duration_hours: 8
      
    device_level:
      method: "X.509 client certificates"
      ca: "ArkSpace Internal CA"
      certificate_validity_days: 365
      storage: "TPM/HSM"
      
    session_level:
      method: "ECDH key exchange (Curve25519)"
      key_rotation_hours: 1
      perfect_forward_secrecy: true
  
  encryption:
    real_time_streams:
      algorithm: "AES-256-GCM"
      key_derivation: "HKDF from ECDH shared secret"
      iv_generation: "Timestamp-based (never reused)"
      latency_overhead_ms: 1
      
    control_plane:
      algorithm: "TLS 1.3"
      cipher_suite: "TLS_AES_256_GCM_SHA384"
      
    data_at_rest:
      algorithm: "AES-256-GCM"
      key_management: "AWS KMS / HashiCorp Vault"
  
  authorization:
    model: "RBAC (Role-Based Access Control)"
    
    roles:
      - {name: "USER", permissions: ["read_own_sessions", "create_session", "emergency_stop_own"]}
      - {name: "OPERATOR", permissions: ["read_all_sessions", "view_telemetry", "view_security_events"]}
      - {name: "ENGINEER", permissions: ["deploy_snn", "update_firewall", "read_all"]}
      - {name: "ADMIN", permissions: ["all"]}

---
# PERFORMANCE CONTRACTS
---

performance_sla:
  
  latency:
    ground_to_satellite_ms: {target: 10, maximum: 15}
    inter_satellite_hop_ms: {target: 10, maximum: 20}
    total_rtt_ms: {target: 40, maximum: 70}
    
  bandwidth:
    oisl_inter_satellite_gbps: {minimum: 60, typical: 100, maximum: 200}
    ground_uplink_mbps: {minimum: 500, typical: 1000}
    ground_downlink_mbps: {minimum: 1000, typical: 2000}
    
  reliability:
    packet_loss_percent: {target: 0.001, maximum: 0.01}
    availability_percent: {target: 99.99}
    failover_time_seconds: {maximum: 1}
    
  state_transfer:
    migration_duration_ms: {target: 100, maximum: 200}
    checkpoint_frequency_seconds: 1
    recovery_time_objective_seconds: 5

---
# DATA FORMATS
---

data_formats:
  
  serialization:
    protocol_buffers:
      version: "proto3"
      language_bindings: ["Python", "C++", "Rust"]
      
  compression:
    algorithms:
      - {name: "LZ4", use_case: "Real-time streams", ratio: "2:1 to 5:1", latency_ms: 1}
      - {name: "ZSTD", use_case: "Bulk transfers", ratio: "5:1 to 10:1", latency_ms: 10}
      
  encoding:
    timestamps: "Nanoseconds since GPS epoch (uint64)"
    identifiers: "UUID v4"
    checksums: "CRC32 or SHA256"

---
# VERSIONING & COMPATIBILITY
---

versioning:
  api_version: "v1"
  protocol_version: "OISL-Neural-v1"
  
  backward_compatibility:
    breaking_changes_policy: "Major version bump (v1 → v2)"
    deprecation_notice_months: 6
    support_duration_years: 2
    
  protobuf_evolution:
    field_addition: "Allowed (backward compatible)"
    field_removal: "Requires deprecation period"
    field_renumbering: "Prohibited"

---
# End of API Contracts
